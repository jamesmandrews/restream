worker_processes 1;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Keep session alive during FFmpeg switches
            drop_idle_publisher 10s;
            idle_streams off;

            # Push to platform — substituted at container startup via entrypoint
            #PUSH_PLACEHOLDER
        }
    }
}
